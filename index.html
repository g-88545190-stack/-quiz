  <script>
    // =========================================================================
    // 1. AUDIO ENGINE (Web Audio SFX + Standard Mandarin TTS)
    // =========================================================================
    const AudioEngine = {
      ctx: null,
      selectedVoice: null,

      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        this.loadBestMandarinVoice();
        if (window.speechSynthesis) {
          window.speechSynthesis.onvoiceschanged = () => this.loadBestMandarinVoice();
        }
      },

      loadBestMandarinVoice() {
        if (!window.speechSynthesis) return;
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;

        // Prioritize standard Beijing Putonghua / broadcast quality zh-CN voices
        const preferredKeywords = [
          'Xiaoxiao', 'Yunxi', 'Yunjian', 'Xiaoyi', // Microsoft Natural Chinese
          'Tingting', 'Ting-Ting', 'Sinji',          // Apple standard Mandarin
          'Google 普通话', 'Microsoft Huihui', 'Yaoyao', 'Kangkang',
          'zh-CN', 'cmn-Hans-CN'
        ];

        let best = null;
        for (const kw of preferredKeywords) {
          best = voices.find(v =>
            (v.lang.includes('zh-CN') || v.lang.includes('cmn-Hans') || v.lang.toLowerCase().includes('zh_cn')) &&
            (v.name.includes(kw) || v.lang.includes(kw))
          );
          if (best) break;
        }
        if (!best) {
          best = voices.find(v => v.lang.startsWith('zh'));
        }
        if (best) {
          this.selectedVoice = best;
          const label = document.getElementById('voiceNameLabel');
          if (label) {
            label.textContent = `播音华语: ${best.name.replace(/Microsoft |Google |Online \(Natural\) - /g, '').slice(0, 14)}`;
          }
        }
      },

      speak(text, options = {}) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        if (this.selectedVoice) {
          utterance.voice = this.selectedVoice;
        }
        utterance.lang = 'zh-CN';
        utterance.rate = options.rate || 0.92; // Slightly clear & warm for Year 4 students
        utterance.pitch = options.pitch || 1.02;

        if (options.onStart) utterance.onstart = options.onStart;
        if (options.onEnd) utterance.onend = options.onEnd;
        if (options.onError) utterance.onerror = options.onEnd;

        window.speechSynthesis.speak(utterance);
      },

      stopSpeak() {
        if (window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
      },

      playTone(freq, type = 'sine', duration = 0.15, delay = 0) {
        try {
          if (!this.ctx) this.init();
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration);
        } catch (e) {}
      },

      sfxCorrect() {
        this.playTone(523.25, 'triangle', 0.12, 0);
        this.playTone(659.25, 'triangle', 0.12, 0.1);
        this.playTone(783.99, 'triangle', 0.25, 0.2);
      },

      sfxWrong() {
        this.playTone(300, 'sine', 0.18, 0);
        this.playTone(250, 'sine', 0.22, 0.15);
      },

      sfxClick() {
        this.playTone(600, 'sine', 0.06, 0);
      },

      sfxFanfare() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          this.playTone(f, 'triangle', 0.25, i * 0.12);
        });
      }
    };

    // =========================================================================

    function showToast(msg, isSuccess = true) {
      const banner = document.getElementById('toastBanner');
      const content = document.getElementById('toastContent');
      content.className = `px-6 py-3 rounded-2xl shadow-xl font-bold text-base flex items-center gap-2 border-2 ${
        isSuccess
          ? 'bg-emerald-50 border-emerald-400 text-emerald-800'
          : 'bg-amber-50 border-amber-400 text-amber-800'
      }`;
      content.innerHTML = `<span>${isSuccess ? '🎉' : '💡'}</span><span>${msg}</span>`;
      banner.classList.remove('opacity-0', 'translate-y-4');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-4');
      }, 2200);
    }

    function addStars(n) {
      State.stars += n;
      document.getElementById('starCount').textContent = State.stars;
    }

    function updateProgress(label, pct) {
      document.getElementById('stageLabel').textContent = label;
      document.getElementById('progressText').textContent = `${Math.round(pct)}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    // Manual Audio Hint Handler for Stages 1-3 (NO AUTO-PLAY)
    function triggerManualHint(text, contextTag) {
      AudioEngine.init();
      State.audioHintClicks += 1;
      State.audioHintDetails.push(contextTag);
      AudioEngine.speak(text);
      showToast('已播放标准华语读音，仔细听哦！', true);
    }

    function jumpToReport() {
      AudioEngine.stopSpeak();
      State.screen = 'report';
      render();
    }

    // -------------------------------------------------------------------------
    // STAGE 1: WARM-UP VISUAL DISCRIMINATION (4 ITEMS, MANUAL AUDIO ONLY)
    // -------------------------------------------------------------------------
    function renderStage1() {
      const q = STAGE1_QUESTIONS[State.s1Index];
      const gridSize = 9;
      const targetPos = Math.floor(Math.random() * gridSize);
      let cellsHtml = '';

      for (let i = 0; i < gridSize; i++) {
        const isTarget = i === targetPos;
        const char = isTarget ? q.target : q.distractor;
        cellsHtml += `
          <button
            onclick="handleStage1Pick(${isTarget}, this)"
            class="hanzi-box btn-3d aspect-square rounded-2xl bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-4xl sm:text-5xl font-bold text-slate-800 flex items-center justify-center cursor-pointer transition"
          >
            ${char}
          </button>
        `;
      }

      return `
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-amber-300">
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <span class="bg-amber-100 text-amber-800 font-bold text-xs px-3 py-1 rounded-full">
              第一关 · 视觉找茬 (${State.s1Index + 1}/4)
            </span>
            <button
              onclick="triggerManualHint('${q.audioText}', '第一关第${State.s1Index + 1}题')"
              class="flex items-center gap-1.5 bg-sky-100 hover:bg-sky-200 text-sky-800 border border-sky-300 text-xs sm:text-sm font-bold px-3.5 py-2 rounded-xl cursor-pointer transition"
            >
              <span>🔊</span>
              <span>不会读？点我听提示</span>
            </button>
          </div>

          <h2 class="text-xl sm:text-2xl font-black text-slate-800 text-center mb-2">
            ${q.prompt}
          </h2>
          <p class="text-center text-sm text-slate-500 mb-6">💡 提示：${q.hint}</p>

          <div class="grid grid-cols-3 gap-3 sm:gap-4 max-w-xs sm:max-w-sm mx-auto">
            ${cellsHtml}
          </div>
        </div>
      `;
    }

    function handleStage1Pick(isTarget, btnEl) {
      if (State.s1Locked) return;
      if (isTarget) {
        State.s1Locked = true;
        const elapsed = ((performance.now() - State.s1QuestionStartTime) / 1000).toFixed(2);
        State.s1ReactionTimes.push(parseFloat(elapsed));
        State.s1Correct += 1;
        addStars(1);
        AudioEngine.sfxCorrect();

        btnEl.classList.remove('bg-amber-50', 'border-amber-300');
        btnEl.classList.add('bg-emerald-400', 'border-emerald-600', 'text-white', 'scale-105');
        showToast(`太神了！只用了 ${elapsed} 秒就找到了！`, true);

        setTimeout(() => {
          State.s1Locked = false;
          State.s1Index += 1;
          if (State.s1Index < STAGE1_QUESTIONS.length) {
            render();
          } else {
            State.screen = 'stage2';
            render();
          }
        }, 900);
      } else {
        AudioEngine.sfxWrong();
        btnEl.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-600');
        showToast('差一点点！再仔细看看笔画哦~', false);
      }
    }

    // -------------------------------------------------------------------------
    // END CERTIFICATE + TEACHER DIAGNOSTIC REPORT
    // -------------------------------------------------------------------------
    function renderReport() {
      const avgSpeed = State.s1ReactionTimes.length
        ? (State.s1ReactionTimes.reduce((a, b) => a + b, 0) / State.s1ReactionTimes.length).toFixed(2)
        : '—';

      const radicalAccuracy = Math.round((State.s2Correct / 8) * 100);
      const memoryAccuracy = Math.round((State.s3Correct / 8) * 100);
      const compAccuracy = Math.round((State.s4Correct / 8) * 100);

      // Determine Learning Style & Teaching Prescription
      let learningType = '';
      let prescription = '';

      if (radicalAccuracy >= memoryAccuracy && radicalAccuracy >= 60) {
        learningType = '🧩 偏旁逻辑推理型（以字带字见效快）';
        prescription = `该生对汉字的<strong>部首归类逻辑</strong>敏感度较高（偏旁解码正确率 ${radicalAccuracy}%）。明年四年级教学建议：<strong>采用“部首家族串连法”</strong>（如一次集中认读“虫字旁：螃、蟹、蚊”、“走之底：迁、递、途”），避免孤立死背单个生字，能大幅加速识字扩容。`;
      } else if (memoryAccuracy > radicalAccuracy && memoryAccuracy >= 60) {
        learningType = '🎨 视觉图像故事型（画面记忆留存率高）';
        prescription = `该生对<strong>图像联想与故事情境</strong>反应敏锐（闪卡回忆留存率 ${memoryAccuracy}%）。明年四年级教学建议：<strong>将抽象生字转化为具象画面或字源小故事</strong>（如“嚣=四个口在头边吵闹”），先建立视觉印象再过渡到书写。`;
      } else {
        learningType = '🎧 听觉先行·双通道辅助型（听懂强于认读）';
        prescription = `该生具备良好的口语听力理解基础（听读理解得分 ${State.s4Correct}/8），但独立视觉解码仍需脚手架。明年教学建议：<strong>充分利用“先听后读、手指指读”策略</strong>，先通过标准朗读建立课文熟悉度，再圈出高频核心词逐个突破。`;
      }

      const audioDependencyNote = State.audioHintClicks <= 3
        ? `主动语音求助仅 <strong>${State.audioHintClicks} 次</strong>，说明孩子愿意尝试独立辨认字形，畏难情绪较低。`
        : `前三关共点击语音求助 <strong>${State.audioHintClicks} 次</strong>（${State.audioHintDetails.slice(0, 5).join('、')}${State.audioHintDetails.length > 5 ? '等' : ''}），反映出其对陌生汉字存在“怕读错”的心理依赖，明年需多给予识字成功体验以建立自信。`;

      return `
        <!-- Student Detective Certificate -->
        <div class="bg-gradient-to-br from-amber-50 via-yellow-50 to-orange-50 rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-amber-400 text-center mb-8 relative overflow-hidden">
          <div class="text-5xl sm:text-6xl mb-3">🏆</div>
          <span class="inline-block bg-amber-500 text-white text-xs font-black px-3.5 py-1 rounded-full tracking-wider mb-2">
            荣耀认证 · 四年级华文先锋小侦探
          </span>
          <h2 class="title-font text-2xl sm:text-4xl text-amber-900 mb-2">
            恭喜完成《踏上学习的征途》特训！
          </h2>
          <p class="text-slate-600 text-sm sm:text-base max-w-lg mx-auto mb-5">
            你成功破解了四年级第一课的偏旁密码、记住了 8 个核心新词，还听懂了李光前先生的奋斗故事！一共获得 <strong class="text-amber-600 text-xl">${State.stars} 颗侦探星星</strong>！
          </p>
          <div class="inline-flex flex-wrap justify-center gap-2 text-xs font-bold">
            <span class="bg-white border border-amber-300 text-amber-800 px-3 py-1.5 rounded-xl">👀 火眼金睛徽章</span>
            <span class="bg-white border border-sky-300 text-sky-800 px-3 py-1.5 rounded-xl">🧩 偏旁解码大师</span>
            <span class="bg-white border border-emerald-300 text-emerald-800 px-3 py-1.5 rounded-xl">🎨 超级图像记忆王</span>
            <span class="bg-white border border-purple-300 text-purple-800 px-3 py-1.5 rounded-xl">🎧 课文听读小能手</span>
          </div>
        </div>

        <!-- Teacher Exclusive Diagnostic Report -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-2 border-slate-300">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b-2 border-slate-100 pb-4 mb-6">
            <div>
              <span class="text-xs font-extrabold uppercase tracking-wider text-indigo-600">TEACHER DIAGNOSTIC DASHBOARD</span>
              <h3 class="text-xl sm:text-2xl font-black text-slate-800">
                📋 老师专属：四年级衔接教学诊断报告
              </h3>
            </div>
            <button onclick="resetFullTest()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-3.5 py-2 rounded-xl border border-slate-300 cursor-pointer">
              🔄 重置重新测试
            </button>
          </div>

          <!-- 4 Core Metrics Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-2xl">
              <div class="text-xs font-bold text-amber-700">1. 视觉辨识速度</div>
              <div class="text-2xl font-black text-slate-800 mt-1">${avgSpeed} <span class="text-xs font-normal">秒/题</span></div>
              <div class="text-xs text-slate-500 mt-0.5">答对 ${State.s1Correct}/4 题</div>
            </div>
            <div class="bg-sky-50 border border-sky-200 p-3.5 rounded-2xl">
              <div class="text-xs font-bold text-sky-700">2. 偏旁解码能力</div>
              <div class="text-2xl font-black text-slate-800 mt-1">${State.s2Correct}/8 <span class="text-xs font-normal">(${radicalAccuracy}%)</span></div>
              <div class="text-xs text-slate-500 mt-0.5">构字逻辑推理力</div>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-2xl">
              <div class="text-xs font-bold text-emerald-700">3. 图像记忆留存</div>
              <div class="text-2xl font-black text-slate-800 mt-1">${State.s3Correct}/8 <span class="text-xs font-normal">(${memoryAccuracy}%)</span></div>
              <div class="text-xs text-slate-500 mt-0.5">抗干扰短时记忆</div>
            </div>
            <div class="bg-purple-50 border border-purple-200 p-3.5 rounded-2xl">
              <div class="text-xs font-bold text-purple-700">4. 听读课文理解</div>
              <div class="text-2xl font-black text-slate-800 mt-1">${State.s4Correct}/8 <span class="text-xs font-normal">(${compAccuracy}%)</span></div>
              <div class="text-xs text-slate-500 mt-0.5">第1-4段语意抓取</div>
            </div>
          </div>

          <!-- Detailed Qualitative Analysis -->
          <div class="space-y-4 text-sm sm:text-base text-slate-700">
            <div class="bg-indigo-50/70 border border-indigo-200 p-4 rounded-2xl">
              <div class="font-black text-indigo-900 mb-1">🎯 判定学习优势通道：${learningType}</div>
              <p class="leading-relaxed text-slate-700">${prescription}</p>
            </div>

            <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl">
              <div class="font-black text-slate-800 mb-1">🔊 独立识字 vs 语音依赖度观察</div>
              <p class="leading-relaxed">${audioDependencyNote}</p>
            </div>

            ${State.s2WrongRadicals.length > 0 ? `
              <div class="bg-rose-50/70 border border-rose-200 p-4 rounded-2xl">
                <div class="font-black text-rose-900 mb-1">⚠️ 明年第一课需重点巩固的偏旁：</div>
                <p class="text-rose-800">学生在 <strong>${State.s2WrongRadicals.join('、')}</strong> 的推理上出现过犹豫，正式授课时可优先用实物或动作演示这几个偏旁。</p>
              </div>
            ` : `
              <div class="bg-emerald-50/70 border border-emerald-200 p-4 rounded-2xl">
                <div class="font-black text-emerald-900 mb-1">✨ 偏旁敏感度极佳：</div>
                <p class="text-emerald-800">8个第一课核心偏旁（虫、口、目、扌、辶、氵、讠）全部一次推理成功！孩子具备很强的“看偏旁猜字义”潜力，只要建立信心，四年级识字量会提升很快。</p>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function resetFullTest() {
      AudioEngine.stopSpeak();
      Object.assign(State, {
        screen: 'welcome',
        stars: 0,
        audioHintClicks: 0,
        audioHintDetails: [],
        s1Index: 0,
        s1Correct: 0,
        s1ReactionTimes: [],
        s1Locked: false,
        s2Index: 0,
        s2Correct: 0,
        s2WrongRadicals: [],
        s2Locked: false,
        s3GroupIdx: 0,
        s3QuizIdx: 0,
        s3Correct: 0,
        s3SwattedCount: 0,
        s3Locked: false,
        s4ParaIdx: 0,
        s4QIdx: 0,
        s4Correct: 0,
        s4Locked: false
      });
      document.getElementById('starCount').textContent = '0';
      render();
    }

    // Initialize on load
    window.onload = function () {
      AudioEngine.init();
      render();
    };
  </script>
</body>
</html>
